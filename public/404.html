<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nothing here — No Brief</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..700;1,6..72,200..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
  .lost { text-align: center; padding: 22vh 0 0; }
  .lost__num { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); }
  .lost h1 { font-weight: 300; font-size: clamp(2.6rem, 9vw, 4.4rem); letter-spacing: -.03em; margin: .7rem 0 1rem; }
  .lost p { font-style: italic; color: var(--ink-soft); margin: 0 0 2rem; }
  .lost a { color: var(--ink); text-decoration-thickness: 1px; text-underline-offset: .22em; text-decoration-color: var(--rule); }
  .lost a:hover { text-decoration-color: var(--accent); }
</style>
</head>
<body>
<div class="sheet">
  <div class="lost">
    <span class="lost__num">Error 404</span>
    <h1>No plate here</h1>
    <p>There were only ever three, and this is not one of them.</p>
    <p><a href="/">Back to the front page</a></p>
  </div>
</div>
</body>
</html>
